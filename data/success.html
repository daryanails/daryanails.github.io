<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=Manrope:wght@400;500;600&subset=cyrillic,latin&display=swap" rel="stylesheet">

<body data-page="success" data-title="title.ok">
<div id="boot" role="status" aria-live="polite"><div class="boot-in"><div class="boot-logo">Darya<i>Nails</i></div><div class="boot-bar"><i></i></div><p id="bootp"></p><button class="btn o sm" type="button" onclick="location.reload()" id="bootb"></button></div></div>
<script>(function(){var ru=true;try{ru=(localStorage.getItem("dnLang")||"ru")!=="en"}catch(e){}
var p=document.getElementById("bootp"),b=document.getElementById("bootb"),n=document.getElementById("boot");
if(b)b.textContent=ru?"Обновить страницу":"Reload page";
setTimeout(function(){if(p&&document.getElementById("boot")){p.textContent=ru?"Загружаем… ещё секунду":"Loading… just a moment";p.className="show"}},1800);
setTimeout(function(){var e=document.getElementById("boot");if(e)e.classList.add("slow")},7000);
setTimeout(function(){var e=document.getElementById("boot");if(e)e.remove()},15000)})();</script>
<!-- same pink veil the home page fades in with -> the two pages feel like one continuous move -->
<div class="curtain arrive" id="arrive" aria-hidden="true"><span>Darya Nails</span></div>
<script>
(function(){
  var c=document.getElementById("arrive");
  function rm(){if(c&&c.parentNode)c.remove()}
  c.addEventListener("animationend",function(e){if(e.target===c)rm()});
  setTimeout(function(){document.body.classList.add("ready");rm()},6000);   /* safety net */
})();
</script>
<header id="hd"></header>

<main id="top">

        </svg>
      </div>
