<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="robots" content="noindex">
<title>Darya Nails — Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,600&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="admin.css">
<script>try{document.documentElement.dataset.theme=localStorage.getItem("dnAdminTheme")||"dark"}catch(e){}</script>
</head>
<body>
<section id="login" class="login" hidden>
  <button class="ghost themebtn lg-t" type="button" aria-label="Theme">◐</button><button class="ghost langbtn lg-l" type="button">EN</button>
  <form id="lf" class="lcard">
    <div class="lock">⚿</div><div class="logo">Darya Nails</div><p class="mut">Studio dashboard · sign in</p>
    <label>Email<input name="email" type="email" autocomplete="username" required></label>
    <label>Password<span class="pw"><input name="pass" type="password" autocomplete="current-password" required><button class="eye" type="button" id="eye">Show</button></span></label>
    <p class="err" id="lerr"></p><button class="btn" id="lbtn">Sign in</button>
    <a class="mut back" href="../index.html">← Back to website</a>
  </form>
</section>
<div id="app" class="app" hidden>
  <aside><div class="logo">Darya Nails</div><nav id="nav"></nav>
    <div class="side-f"><span id="who" class="mut"></span><div><button class="ghost langbtn" type="button">RU</button><button class="ghost themebtn" id="theme">◐ Theme</button><button class="ghost" id="out">Sign out</button></div></div></aside>
  <main><h1 id="title"></h1><div id="view"></div></main>
</div>
<dialog id="dlg"></dialog>
<dialog id="lb"><img id="lbi" alt=""></dialog>
<script type="module" src="admin.js"></script>
</body></html>
